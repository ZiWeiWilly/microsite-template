name: Weekly Blog Post

on:
  schedule:
    - cron: '0 4 * * 1'   # Monday 4:00 AM UTC
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write
  pages: write

jobs:
  generate-blog-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate blog post
        run: npm run generate-blog
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Rebuild site
        run: npm run build

      - name: Commit blog content to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/ src/data/blog/ src/i18n/ scripts/topics.json images/
          git diff --cached --quiet || git commit -m "Add blog post $(date +%Y-%m-%d)"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.git,.github,node_modules,scripts,src,admin,site-config.json,package.json,package-lock.json,.gitignore,.eslintrc*'
