name: Generate Site & Deploy

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'JSON config string (attractionName, klookUrl, domain, affiliateUrl, baseCurrency, colors, languages)'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Write config file
        run: echo '${{ inputs.config }}' > site-config.json

      - name: Generate site content
        run: node scripts/generate-site.js site-config.json
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Build site
        run: node src/build.js

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Commit generated content to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-generate site content for $(jq -r .attractionName site-config.json)"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
