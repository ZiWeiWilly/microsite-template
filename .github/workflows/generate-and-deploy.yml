name: Generate Site

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'JSON config string (attractionName, klookUrl, domain, affiliateUrl, baseCurrency, colors, languages)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Write config file
        run: echo '${{ inputs.config }}' > site-config.json

      - name: Generate site content
        run: node scripts/generate-site.js site-config.json
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional but strongly recommended: lets generate-site.js scrape the
          # Klook activity page for ground-truth address + lat/lng (otherwise
          # falls back to LLM-only research, which can hallucinate addresses).
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      - name: Build site
        run: node src/build.js

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Commit generated content to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-generate site content for $(jq -r .attractionName site-config.json)"
          git push

      - name: Verify deployment inputs
        run: |
          test -f package.json
          test -f src/build.js
          ls src

      # Detect deploy target by checking which secret is present
      - name: Detect deploy target
        id: detect
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "target=vercel" >> $GITHUB_OUTPUT
          elif [ -n "$CF_API_TOKEN" ]; then
            echo "target=cloudflare" >> $GITHUB_OUTPUT
          else
            echo "target=none" >> $GITHUB_OUTPUT
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      # ── Test environment: deploy to Vercel ──────────────────────────────────
      - name: Deploy to Vercel (test)
        if: steps.detect.outputs.target == 'vercel'
        run: npx vercel@latest --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── Production environment: deploy to Cloudflare Pages via wrangler ──
      # Built HTML files are gitignored, so we can't rely on git-based CF Pages
      # integration. Instead we stage deployable assets and upload directly.
      - name: Deploy to Cloudflare Pages (production)
        if: steps.detect.outputs.target == 'cloudflare'
        run: |
          DOMAIN=$(jq -r .domain site-config.json)
          PROJECT_NAME=$(echo "$DOMAIN" | tr '.' '-')

          # Stage deployable files (exclude source/build tooling)
          mkdir -p _deploy
          cp -r css js images data _deploy/ 2>/dev/null || true
          [ -f sitemap.xml ] && cp sitemap.xml _deploy/
          [ -f robots.txt ]  && cp robots.txt  _deploy/
          find . -maxdepth 1 -name '*.html' -exec cp {} _deploy/ \;
          for lang in zh-CN zh-TW ja ko de fr hi ru vi ms lo; do
            [ -d "$lang" ] && cp -r "$lang" _deploy/
          done

          # Deploy (creates project on first run, updates on subsequent runs)
          npx wrangler@latest pages deploy _deploy/ \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true

          # Attach custom domain (idempotent — safe to re-run)
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT_NAME/domains" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$DOMAIN\"}")
          echo "Custom domain API response: $RESPONSE"
          # 200 = added, 409 = already exists — both are fine
          [[ "$RESPONSE" == "200" || "$RESPONSE" == "409" ]] || echo "⚠️  Custom domain may need manual setup in CF dashboard"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
